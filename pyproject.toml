[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmis"
version = "0.1.0"
description = "Evidence-aware multi-path reasoning for target-oriented multimodal implicit sentiment analysis"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<3",
  "transformers>=4.46,<5",
  "sentencepiece>=0.2,<1",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "tqdm>=4.66,<5"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
